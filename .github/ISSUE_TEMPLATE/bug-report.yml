name: Bug report
description: Report an installation, resolution, or CLI defect without including secrets.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Issues are not confidential. Do not include credentials, private paths or exploitable vulnerability details. Read [the security policy](https://github.com/wiyco/agent-skills-kit/blob/main/SECURITY.md) for reporting availability before sharing security information.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, target host version, and scope
      description: Use sanitized paths; never include credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and expected/actual behavior
      description: Prefer a benign fixture under temporary directories.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
