name: Implementation task
description: A bounded task suitable for a human or local AI agent.
title: "[Task]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and context
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable checkboxes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and relevant platforms
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and primary references
