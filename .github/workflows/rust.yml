name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read development pin
        run: python -c 'import tomllib; print("DEV_TOOLCHAIN=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        run: rustup toolchain install "$DEV_TOOLCHAIN" --profile minimal
      - name: Cache build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.DEV_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-native
      - run: rustc -Vv && cargo -V && rustup show active-toolchain
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - name: Test the standalone public API consumer
        run: cargo test --manifest-path examples/external-consumer/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/external-consumer
      - name: Lint Windows-specific unsafe boundaries
        if: runner.os == 'Windows'
        run: |
          rustup component add clippy --toolchain "$DEV_TOOLCHAIN"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify the Windows backend on the declared MSRV
        if: runner.os == 'Windows'
        run: |
          WINDOWS_MSRV_TOOLCHAIN=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$WINDOWS_MSRV_TOOLCHAIN" --profile minimal
          cargo +"$WINDOWS_MSRV_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$WINDOWS_MSRV_TOOLCHAIN" test --workspace --all-features --locked
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/external-consumer-msrv" cargo +"$WINDOWS_MSRV_TOOLCHAIN" test --manifest-path examples/external-consumer/Cargo.toml --locked

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read development pin
        run: python -c 'import tomllib; print("DEV_TOOLCHAIN=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_ENV"
      - name: Install quality components
        run: rustup toolchain install "$DEV_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Cache build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.DEV_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-quality
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check standalone consumer formatting and lint
        run: |
          cargo fmt --manifest-path examples/external-consumer/Cargo.toml -- --check
          cargo clippy --manifest-path examples/external-consumer/Cargo.toml --all-targets --locked -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/external-consumer
      - name: Verify generated bundled catalog documentation
        run: |
          cargo run --quiet -p agent-skills-kit --example catalog_markdown --locked > docs/targets.md
          git diff --exit-code -- docs/targets.md
      - name: Test offline maintenance evidence audit
        run: |
          python --version
          cargo run --quiet -p agent-skills-kit --example catalog_json --locked > "$RUNNER_TEMP/ask-catalog.json"
          python -B .github/scripts/catalog_drift.py --catalog "$RUNNER_TEMP/ask-catalog.json" > "$RUNNER_TEMP/ask-evidence-report.json"
          python -B -m unittest discover -s .github/scripts/tests -v
      - name: Prove formatting and lint gates reject regressions
        run: python .github/scripts/verify-quality-gates.py
      - name: Verify pinned dependency policy tool
        run: |
          mkdir "$RUNNER_TEMP/ask-cargo-deny"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --output "$RUNNER_TEMP/ask-cargo-deny/tool.tar.gz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/ask-cargo-deny/tool.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ask-cargo-deny/tool.tar.gz" -C "$RUNNER_TEMP/ask-cargo-deny" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - name: Check dependency policy and controlled failures
        run: python -B .github/scripts/verify-dependencies.py --cargo-deny "$RUNNER_TEMP/ask-cargo-deny/cargo-deny"
        env:
          CARGO_HOME: ${{ runner.temp }}/ask-dependency-cargo

  compatibility:
    name: compatibility (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compatibility toolchain
        env:
          COMPAT_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$COMPAT_TOOLCHAIN" --profile minimal
      - name: Check and test independently of the development override
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          python -c 'import os, tomllib; declared = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"]; tested = os.environ["RUSTUP_TOOLCHAIN"]; assert tested == "stable" or tested == declared, "MSRV job must match Cargo metadata"'
          rustc -Vv
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/external-consumer" cargo test --manifest-path examples/external-consumer/Cargo.toml --locked
