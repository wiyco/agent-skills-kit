name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read development pin
        run: python -c 'import tomllib; print("DEV_TOOLCHAIN=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        run: rustup toolchain install "$DEV_TOOLCHAIN" --profile minimal
      - name: Cache build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.DEV_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-native
      - run: rustc -Vv && cargo -V && rustup show active-toolchain
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read development pin
        run: python -c 'import tomllib; print("DEV_TOOLCHAIN=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_ENV"
      - name: Install quality components
        run: rustup toolchain install "$DEV_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Cache build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.DEV_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-quality
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Prove formatting and lint gates reject regressions
        run: python .github/scripts/verify-quality-gates.py

  compatibility:
    name: compatibility (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compatibility toolchain
        env:
          COMPAT_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$COMPAT_TOOLCHAIN" --profile minimal
      - name: Check and test independently of the development override
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          python -c 'import os, tomllib; declared = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"]; tested = os.environ["RUSTUP_TOOLCHAIN"]; assert tested == "stable" or tested == declared, "MSRV job must match Cargo metadata"'
          rustc -Vv
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked
