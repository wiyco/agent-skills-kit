[package]
name = "agent-skills-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Work-in-progress library-first toolkit for local Agent Skills installation"
repository = "https://github.com/wiyco/agent-skills-kit"
documentation = "https://github.com/wiyco/agent-skills-kit/blob/main/docs/api.md"
readme = "README.md"
keywords = ["agent-skills", "skills", "installer"]
categories = ["development-tools"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "third-party/**", "src/**", "tests/**", "examples/**"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
saphyr-parser = { version = "0.2.2", default-features = false }
unicode-normalization = "0.1.25"
caseless = "0.2.2"
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization"] }
