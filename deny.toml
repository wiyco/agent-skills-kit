# Development policy; publication still requires the separate release gate.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = []
maximum-db-staleness = "P7D"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.95
include-dev = true

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
